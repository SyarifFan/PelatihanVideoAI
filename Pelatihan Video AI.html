 else if(b.id==='cp'){navigator.clipboard.writeText($('out').value).then(()=>toast('Prompt tersalin'),()=>{$('out').select();toast('Salin otomatis gagal. Teks sudah dipilih, tekan Ctrl+C.')})}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.pop').forEach(u=>u.hidden=true)});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.s){t.parentElement.querySelector('select').innerHTML=selOpts(d.s,t.value);return}
 if(d.m){S.f[d.m]=[...document.querySelectorAll(`[data-m="${d.m}"]:checked`)].map(x=>x.value);save();return}
 if(d.k){S.f[d.k]=t.type==='number'?+t.value:t.value;if(t.tagName==='SELECT'){const o=opt(d.k,t.value);$('d_'+d.k).textContent=o?o.description:'';$('c_'+d.k).hidden=t.value!=='kustom'}save();if(/^scene|^duration/.test(d.k))scSum()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='pt'||t.id==='pm'){P.type=$('pt').value;P.mode=$('pm').value;render()}
 else if(t.id==='imp'&&t.files[0]){const f=t.files[0];if(f.size>1e6)return toast('File terlalu besar (maks 1 MB).');const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=='Storybord Video AI'||typeof j.f!=='object'||Array.isArray(j.f))throw 0;if(confirm('Ganti proyek aktif dengan "'+(j.f.title||'tanpa judul').slice(0,60)+'"?')){S=j;save();view='m1';render();toast('Proyek dipulihkan')}}catch(x){toast('File tidak valid: bukan ekspor Storybord Video AI.')}};r.readAsText(f)}});
$('sv').textContent=S.meta.updatedAt?'Draft dimuat':'';render();
</script></body></html>
